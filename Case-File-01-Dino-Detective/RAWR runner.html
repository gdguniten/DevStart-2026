<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino Runner - Color Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/q5@latest/q5.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            margin: 0;
            background: linear-gradient(135deg, #e0f7ff, #fff3c4);
            color: #183153;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            overflow: hidden;
        }

        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 820px;
            padding: 20px;
            box-sizing: border-box;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 12px;
            font-family: monospace;
            font-size: 16px;
            font-weight: bold;
            color: #183153;
            letter-spacing: 1px;
        }

        canvas {
            display: block;
            background: linear-gradient(#dff7ff, #f5ffe6);
            border: 3px solid #2d6a4f;
            border-radius: 14px;
            box-shadow: 0 8px 22px #174b5b22;
        }

        /* Overlay panel below canvas on game over */
        .game-over-overlay {
            width: 100%;
            margin-top: 16px;
            padding: 18px 24px;
            background: #fff8dc;
            border: 2px solid #ffb703;
            border-radius: 6px;
            box-sizing: border-box;
            display: none; /* Controlled by JS */
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: fadeIn 0.2s ease-in-out;
        }

        .game-over-overlay.visible {
            display: flex;
        }

        .overlay-title {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
            color: #d9480f;
        }

        .overlay-stats {
            display: flex;
            gap: 24px;
            margin: 10px 0 16px 0;
            font-family: monospace;
            font-size: 15px;
            color: #444;
        }

        .restart-btn {
            background: #2d6a4f;
            color: #ffffff;
            border: none;
            padding: 10px 24px;
            font-family: monospace;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .restart-btn:hover {
            background: #40916c;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .controls-hint {
            margin-top: 12px;
            font-family: monospace;
            font-size: 12px;
            color: #777777;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <div class="hud">
        <span id="high-score-display">HI 00000</span>
        <span id="score-display">00000</span>
        <span id="power-display">🪙 COINS: 0</span>
    </div>
    
    <div id="canvas-holder"></div>

    <!-- Game Over Overlay Below Screen -->
    <div id="game-over-panel" class="game-over-overlay">
        <div class="overlay-title">Game Over</div>
        <div class="overlay-stats">
            <div>SCORE: <span id="overlay-score">00000</span></div>
            <div>BEST: <span id="overlay-high">00000</span></div>
        </div>
        <button class="restart-btn" onclick="resetGame()">[ PRESS SPACE OR CLICK TO RESTART ]</button>
    </div>

    <div class="controls-hint">&gt; SPACE / UP TO JUMP // DOWN TO DUCK // CLICK TO RESTART</div>
</div>

<script>
let dino;
let obstacles = [];
let particles = [];
let coins = [];
let powerups = [];
let bonusPoints = 0;
let shieldTimer = 0;
let score = 0;
let highScore = 0;
let gameOver = false;
let gameSpeed = 6;

function setup() {
    let cnv = createCanvas(800, 250);
    cnv.parent('canvas-holder');
    dino = new Dino();
}

function draw() {
    background(255); // wipe the previous frame (removes the afterimage)

    // Bright sky with a soft color gradient (filled rects, no gaps)
    noStroke();
    for (let y = 0; y < height; y += 5) {
        let t = y / height;
        fill(lerpColor(color(125, 211, 252), color(236, 252, 203), t));
        rect(0, y, width, 6);
    }

    // Decorative clouds
    fill(255, 255, 255, 190);
    ellipse(150, 45, 65, 24); ellipse(175, 40, 38, 30); ellipse(130, 40, 35, 25);
    ellipse(570, 65, 75, 25); ellipse(595, 58, 40, 32); ellipse(550, 60, 38, 24);

    // Minimal ground line
    stroke('#2d6a4f');
    strokeWeight(4);
    line(0, height - 20, width, height - 20);
    noStroke();
    fill('#95d5b2');
    rect(0, height - 16, width, 16);

    if (!gameOver) {
        score++;
        if (shieldTimer > 0) shieldTimer--;
        document.getElementById('score-display').innerText = String(score + bonusPoints).padStart(5, '0');
        document.getElementById('power-display').innerText = shieldTimer > 0 ? '🛡️ SHIELD ON' : '🪙 COINS: ' + Math.floor(bonusPoints / 100);
        gameSpeed = 6 + Math.floor(score / 400) * 0.5;

        let formattedScore = String(score).padStart(5, '0');
        let formattedHigh = String(highScore).padStart(5, '0');
        document.getElementById('score-display').innerText = String(score + bonusPoints).padStart(5, '0');
        
        if (score + bonusPoints > highScore) {
            highScore = score + bonusPoints;
            document.getElementById('high-score-display').innerText = `HI ${String(highScore).padStart(5, '0')}`;
        }

        // Spawn obstacles
        if (frameCount % Math.max(45, Math.floor(80 - (score / 100))) === 0) {
            if (random(1) < 0.65) {
                obstacles.push(new Cactus());
            } else {
                obstacles.push(new Bird());
            }
        }

        // Spawn collectible coins and occasional shield power-ups
        if (frameCount % 65 === 0 && random(1) < 0.8) coins.push(new Coin());
        if (frameCount % 420 === 0 && random(1) < 0.75) powerups.push(new ShieldPowerup());

        for (let i = coins.length - 1; i >= 0; i--) {
            coins[i].update();
            coins[i].show();
            if (coins[i].collectedBy(dino)) {
                bonusPoints += 100;
                for (let j = 0; j < 8; j++) particles.push(new Particle(coins[i].x, coins[i].y));
                coins.splice(i, 1);
            } else if (coins[i].offscreen()) coins.splice(i, 1);
        }

        for (let i = powerups.length - 1; i >= 0; i--) {
            powerups[i].update();
            powerups[i].show();
            if (powerups[i].collectedBy(dino)) {
                shieldTimer = 300; // about five seconds at 60 FPS
                powerups.splice(i, 1);
            } else if (powerups[i].offscreen()) powerups.splice(i, 1);
        }

        // Update & draw obstacles
        for (let i = obstacles.length - 1; i >= 0; i--) {
            obstacles[i].update();
            obstacles[i].show();

            if (dino.hits(obstacles[i]) && shieldTimer <= 0) {
                triggerGameOver();
            }

            if (obstacles[i].offscreen()) {
                obstacles.splice(i, 1);
            }
        }

        // Update & draw dino
        dino.update();
        dino.show();
        if (shieldTimer > 0) {
            noFill(); stroke('#00b4d8'); strokeWeight(3);
            ellipse(dino.x + 20, dino.y + 20, 58, 58);
            noStroke();
        }

        // Update particles
        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            particles[i].show();
            if (particles[i].alpha <= 0) {
                particles.splice(i, 1);
            }
        }

    } else {
        // Draw static game screen state
        dino.show();
        for (let obs of obstacles) obs.show();
        for (let coin of coins) coin.show();
        for (let powerup of powerups) powerup.show();

        fill('#d9480f');
        noStroke();
        textAlign(CENTER, CENTER);
        textSize(22);
        textFont('monospace');
        text("G A M E  O V E R", width / 2, height / 2 - 10);
    }
}

function triggerGameOver() {
    gameOver = true;
    document.getElementById('overlay-score').innerText = String(score + bonusPoints).padStart(5, '0');
    document.getElementById('overlay-high').innerText = String(highScore).padStart(5, '0');
    document.getElementById('game-over-panel').classList.add('visible');
}

function keyPressed() {
    if (key === ' ' || keyCode === UP_ARROW) {
        if (gameOver) {
            resetGame();
        } else {
            dino.jump();
        }
    }
    if (keyCode === DOWN_ARROW || key === 's' || key === 'S') {
        dino.duck(true);
    }
}

function keyReleased() {
    if (keyCode === DOWN_ARROW || key === 's' || key === 'S') {
        dino.duck(false);
    }
}

function mousePressed() {
    if (mouseY > 0 && mouseY < height && mouseX > 0 && mouseX < width) {
        if (gameOver) {
            resetGame();
        } else {
            dino.jump();
        }
    }
}

function resetGame() {
    score = 0;
    bonusPoints = 0;
    shieldTimer = 0;
    obstacles = [];
    coins = [];
    powerups = [];
    particles = [];
    gameOver = false;
    document.getElementById('game-over-panel').classList.remove('visible');
    loop();
}

class Dino {
    constructor() {
        this.r = 40;
        this.x = 60;
        this.y = height - 20 - this.r;
        this.vy = 0;
        this.gravity = 0.85;
        this.isDucking = false;
    }

    jump() {
        if (this.y >= height - 20 - this.r - 2) {
            this.vy = -14;
        }
    }

    duck(ducking) {
        this.isDucking = ducking;
    }

    update() {
        this.y += this.vy;
        this.vy += this.gravity;

        let targetY = height - 20 - this.r;
        if (this.y > targetY) {
            this.y = targetY;
            this.vy = 0;
        }
    }

    show() {
        push();
        translate(this.x + this.r / 2, this.y + this.r / 2);
        
        // Squeeze dino vertically when ducking
        if (this.isDucking) {
            scale(-1, 0.5);
        } else {
            scale(-1, 1);
        }

        textAlign(CENTER, CENTER);
        textSize(42);
        text('🦖', 0, 0);
        pop();
    }

    hits(obs) {
        let currentH = this.isDucking ? this.r * 0.5 : this.r;
        let currentY = this.isDucking ? this.y + this.r * 0.5 : this.y;
        return collideRectRect(this.x, currentY, this.r, currentH, obs.x, obs.y, obs.w, obs.h);
    }
}

class Cactus {
    constructor() {
        this.w = 26;
        this.h = random([36, 48]);
        this.x = width;
        this.y = height - 20 - this.h;
    }

    update() {
        this.x -= gameSpeed;
    }

    show() {
        push();
        textAlign(CENTER, BOTTOM);
        textSize(40);
        text('🌵', this.x + this.w / 2, this.y + this.h + 2);
        pop();
    }

    offscreen() {
        return this.x < -this.w - 10;
    }
}

class Bird {
    constructor() {
        this.w = 32;
        this.h = 24;
        this.x = width;
        this.y = height - 20 - random([50, 85]);
    }

    update() {
        this.x -= gameSpeed + 1;
    }

    show() {
        push();
        textAlign(CENTER, CENTER);
        textSize(36);
        text('🦅', this.x + this.w / 2, this.y + this.h / 2);
        pop();
    }

    offscreen() {
        return this.x < -this.w - 10;
    }
}

class Coin {
    constructor() {
        this.x = width + 10;
        this.y = random([height - 65, height - 95, height - 125]);
        this.r = 13;
    }
    update() { this.x -= gameSpeed; }
    show() {
        push();
        stroke('#b77900'); strokeWeight(2);
        fill('#ffd60a'); ellipse(this.x, this.y, this.r * 2);
        noStroke(); fill('#fff3a3'); ellipse(this.x - 3, this.y - 3, 7, 7);
        fill('#9c6500'); textAlign(CENTER, CENTER); textSize(13); text('$', this.x, this.y + 1);
        pop();
    }
    collectedBy(player) {
        return collideRectRect(player.x, player.y, player.r, player.r,
            this.x - this.r, this.y - this.r, this.r * 2, this.r * 2);
    }
    offscreen() { return this.x < -30; }
}

class ShieldPowerup {
    constructor() {
        this.x = width + 10;
        this.y = random([height - 70, height - 105]);
        this.r = 15;
    }
    update() { this.x -= gameSpeed; }
    show() {
        push();
        stroke('#0077b6'); strokeWeight(2);
        fill('#90e0ef'); ellipse(this.x, this.y, this.r * 2);
        noStroke(); textAlign(CENTER, CENTER); textSize(20); text('🛡️', this.x, this.y);
        pop();
    }
    collectedBy(player) {
        return collideRectRect(player.x, player.y, player.r, player.r,
            this.x - this.r, this.y - this.r, this.r * 2, this.r * 2);
    }
    offscreen() { return this.x < -35; }
}

class Particle {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.vx = random(-2, 2);
        this.vy = random(-2, 2);
        this.alpha = 255;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= 12;
    }
    show() {
        fill(255, 183, 3, this.alpha);
        noStroke();
        rect(this.x, this.y, 3, 3);
    }
}

function collideRectRect(x1, y1, w1, h1, x2, y2, w2, h2) {
    return x1 + w1 >= x2 && x1 <= x2 + w2 && y1 + h1 >= y2 && y1 <= y2 + h2;
}
</script>

</body>
</html>
