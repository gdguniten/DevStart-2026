\<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino Runner - Color Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/q5@latest/q5.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            margin: 0;
            background: linear-gradient(135deg, #e0f7ff, #fff3c4);
            color: #183153;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            overflow: hidden;
        }

        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 820px;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 12px;
            font-family: monospace;
            font-size: 16px;
            font-weight: bold;
            color: #183153;
            letter-spacing: 1px;
        }

        .canvas-container {
            position: relative;
            display: block;
        }

        canvas {
            display: block;
            background: linear-gradient(#dff7ff, #f5ffe6);
            border: 3px solid #2d6a4f;
            border-radius: 14px;
            box-shadow: 0 8px 22px #174b5b22;
        }

        /* Consistent Game Over Overlay */
        .game-over-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            max-width: 360px;
            padding: 30px 24px;
            background: rgba(255, 248, 220, 0.92);
            backdrop-filter: blur(6px);
            border: 2px solid #ffb703;
            border-radius: 12px;
            box-sizing: border-box;
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 16px 32px rgba(23, 75, 91, 0.15);
            animation: fadeIn 0.2s ease-in-out;
            z-index: 10;
        }

        .game-over-overlay.visible {
            display: flex;
        }

        .overlay-title {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
            color: #d9480f;
        }

        .overlay-stats {
            display: flex;
            gap: 20px;
            margin: 6px 0 20px 0;
            font-family: monospace;
            font-size: 14px;
            color: #444;
        }

        .overlay-stats span {
            color: #183153;
            font-weight: bold;
        }

        .restart-btn {
            background: #2d6a4f;
            color: #ffffff;
            border: none;
            padding: 10px 22px;
            font-family: monospace;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.1s ease;
        }

        .restart-btn:hover {
            background: #40916c;
            transform: translateY(-1px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -46%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }

        .controls-hint {
            margin-top: 12px;
            font-family: monospace;
            font-size: 12px;
            color: #777777;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <div class="hud">
        <span id="high-score-display">HI 00000</span>
        <span id="score-display">00000</span>
        <span id="power-display">❤️ LIVES: 3</span>
    </div>
    
    <div class="canvas-container">
        <div id="canvas-holder"></div>

        <div id="game-over-panel" class="game-over-overlay">
            <div class="overlay-title">Game Over</div>
            <div class="overlay-stats">
                <div>SCORE: <span id="overlay-score">00000</span></div>
                <div>BEST: <span id="overlay-high">00000</span></div>
            </div>
            <button class="restart-btn" onclick="resetGame()">[ RESTART ]</button>
        </div>
    </div>

    <div class="controls-hint">&gt; SPACE / UP TO JUMP // DOWN TO DUCK // [D] TOGGLE DEBUG CAPSULE</div>
</div>

<script>
let dino;
let obstacles = [];
let particles = [];
let coins = [];
let powerups = [];
let bonusPoints = 0;
let shieldTimer = 0;
let hitBlinkTimer = 0;
let slowTimer = 0;
let score = 0;
let highScore = 0;
let gameOver = false;
let gameSpeed = 6;
let debugMode = false;

class Particle {
    constructor(x, y, charEmoji = null, customColor = null) {
        this.x = x;
        this.y = y;
        this.vx = random(-3, 3);
        this.vy = charEmoji ? random(-2, -5) : random(-2, 2);
        this.char = charEmoji;
        this.alpha = 255;
        this.decay = charEmoji ? random(10, 20) : 12;
        this.customColor = customColor;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.char) {
            this.vy += 0.3;
        }
        this.alpha -= this.decay;
    }
    show() {
        push();
        if (this.char) {
            textSize(14);
            textAlign(CENTER, CENTER);
            fill(this.customColor ? this.customColor : color(255, 183, 3), Math.max(0, this.alpha));
            text(this.char, this.x, this.y);
        } else {
            fill(this.customColor ? this.customColor : color(255, 183, 3), this.alpha);
            noStroke();
            rect(this.x, this.y, 3, 3);
        }
        pop();
    }
}

function setup() {
    let cnv = createCanvas(800, 250);
    cnv.parent('canvas-holder');
    dino = new Dino();
}

function draw() {
    background(255);

    noStroke();
    for (let y = 0; y < height; y += 5) {
        let t = y / height;
        fill(lerpColor(color(125, 211, 252), color(236, 252, 203), t));
        rect(0, y, width, 6);
    }

    fill(255, 255, 255, 190);
    ellipse(150, 45, 65, 24); ellipse(175, 40, 38, 30); ellipse(130, 40, 35, 25);
    ellipse(570, 65, 75, 25); ellipse(595, 58, 40, 32); ellipse(550, 60, 38, 24);

    stroke('#2d6a4f');
    strokeWeight(4);
    line(0, height - 20, width, height - 20);
    noStroke();
    fill('#95d5b2');
    rect(0, height - 16, width, 16);

    let effectiveSpeed = gameSpeed;
    if (!gameOver) {
        if (slowTimer > 0) {
            slowTimer--;
            effectiveSpeed *= 0.5;
        }
        score++;
        if (shieldTimer > 0) shieldTimer--;
        if (hitBlinkTimer > 0) hitBlinkTimer--;

        document.getElementById('power-display').innerText = shieldTimer > 0 ? '🛡️ SHIELD ON' : '❤️ LIVES: ' + dino.lives;
        gameSpeed = 6 + Math.floor(score / 400) * 0.5;

        let formattedScore = String(score + bonusPoints).padStart(5, '0');
        document.getElementById('score-display').innerText = formattedScore;
        
        if (score + bonusPoints > highScore) {
            highScore = score + bonusPoints;
            document.getElementById('high-score-display').innerText = `HI ${String(highScore).padStart(5, '0')}`;
        }

        if (frameCount % Math.max(45, Math.floor(80 - (score / 100))) === 0) {
            if (random(1) < 0.65) {
                obstacles.push(new Cactus());
            } else {
                obstacles.push(new Bird());
            }
        }

        if (frameCount % 65 === 0 && random(1) < 0.8) coins.push(new Coin(effectiveSpeed));
        if (frameCount % 420 === 0 && random(1) < 0.75) powerups.push(new ShieldPowerup(effectiveSpeed));

        for (let i = coins.length - 1; i >= 0; i--) {
            coins[i].update(effectiveSpeed);
            coins[i].show();
            if (coins[i].collectedBy(dino)) {
                bonusPoints += 100;
                for (let j = 0; j < 8; j++) particles.push(new Particle(coins[i].x, coins[i].y));
                coins.splice(i, 1);
            } else if (coins[i].offscreen()) coins.splice(i, 1);
        }

        for (let i = powerups.length - 1; i >= 0; i--) {
            powerups[i].update(effectiveSpeed);
            powerups[i].show();
            if (powerups[i].collectedBy(dino)) {
                shieldTimer = 300;
                for (let j = 0; j < 12; j++) {
                    particles.push(new Particle(powerups[i].x, powerups[i].y, '✨', color(0, 180, 216)));
                }
                powerups.splice(i, 1);
            } else if (powerups[i].offscreen()) powerups.splice(i, 1);
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
            obstacles[i].update(effectiveSpeed);
            obstacles[i].show();

            if (dino.hits(obstacles[i])) {
                if (shieldTimer > 0) {
                    shieldTimer = 0;
                    for (let j = 0; j < 12; j++) {
                        particles.push(new Particle(dino.x + 20, dino.y + 20, '💥', color(217, 72, 15)));
                    }
                    obstacles.splice(i, 1);
                } else if (hitBlinkTimer <= 0) {
                    dino.lives--;
                    hitBlinkTimer = 90;
                    slowTimer = 60;
                    obstacles.splice(i, 1);
                    if (dino.lives <= 0) {
                        triggerGameOver();
                    }
                }
            } else if (obstacles[i].offscreen()) {
                obstacles.splice(i, 1);
            }
        }

        dino.update();
        dino.show();
        
        if (shieldTimer > 0) {
            noFill(); stroke('#00b4d8'); strokeWeight(3);
            ellipse(dino.x + 20, dino.y + 20, 58, 58);
            noStroke();
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            particles[i].show();
            if (particles[i].alpha <= 0) {
                particles.splice(i, 1);
            }
        }

    } else {
        dino.show();
        for (let obs of obstacles) obs.show();
        for (let coin of coins) coin.show();
        for (let powerup of powerups) powerup.show();

        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            particles[i].show();
            if (particles[i].alpha <= 0) {
                particles.splice(i, 1);
            }
        }
    }
}

function triggerGameOver() {
    gameOver = true;
    for (let p = 0; p < 12; p++) {
        particles.push(new Particle(dino.x, dino.y - 15, '💥', color(217, 72, 15)));
    }
    document.getElementById('overlay-score').innerText = String(score + bonusPoints).padStart(5, '0');
    document.getElementById('overlay-high').innerText = String(highScore).padStart(5, '0');
    document.getElementById('game-over-panel').classList.add('visible');
}

function keyPressed() {
    if (key === 'd' || key === 'D') {
        debugMode = !debugMode;
        return;
    }
    if (key === ' ' || keyCode === UP_ARROW || key === 'w' || key === 'W') {
        if (gameOver) {
            resetGame();
        } else {
            dino.jump();
        }
    }
    if (keyCode === DOWN_ARROW || key === 's' || key === 'S') {
        dino.duck(true);
    }
}

function keyReleased() {
    if (keyCode === DOWN_ARROW || key === 's' || key === 'S') {
        dino.duck(false);
    }
}

function mousePressed() {
    if (mouseY > 0 && mouseY < height && mouseX > 0 && mouseX < width) {
        if (gameOver) {
            resetGame();
        } else {
            dino.jump();
        }
    }
}

function resetGame() {
    score = 0;
    bonusPoints = 0;
    shieldTimer = 0;
    hitBlinkTimer = 0;
    slowTimer = 0;
    obstacles = [];
    coins = [];
    powerups = [];
    particles = [];
    gameOver = false;
    dino.lives = 3;
    document.getElementById('game-over-panel').classList.remove('visible');
    loop();
}

class Dino {
    constructor() {
        this.r = 40;
        this.x = 60;
        this.y = height - 20 - this.r;
        this.vy = 0;
        this.gravity = 0.85;
        this.isDucking = false;
        this.lives = 3;
    }

    jump() {
        let currentH = this.isDucking ? this.r * 0.5 : this.r;
        if (this.y >= height - 20 - currentH - 2) {
            this.vy = -14;
            for (let i = 0; i < 4; i++) {
                particles.push(new Particle(this.x, height - 20));
            }
        }
    }

    duck(ducking) {
        this.isDucking = ducking;
        if (ducking) {
            this.y -= 1;
        }
    }

    update() {
        this.y += this.vy;
        this.vy += this.gravity;

        let currentH = this.isDucking ? this.r * 0.5 : this.r;
        let targetY = height - 20 - currentH;
        if (this.y > targetY) {
            this.y = targetY;
            this.vy = 0;
        }
    }

    show() {
        if (hitBlinkTimer > 0 && Math.floor(hitBlinkTimer / 4) % 2 === 0) return;

        push();
        translate(this.x + this.r / 2, this.y + (this.isDucking ? this.r * 0.25 : this.r / 2));
        
        if (this.isDucking) {
            scale(-1, 0.5);
        } else {
            scale(-1, 1);
        }

        textAlign(CENTER, CENTER);
        textSize(42);
        text(gameOver ? '💀' : '🦖', 0, 0);
        pop();

        if (debugMode) {
            this.drawCapsuleDebug();
        }
    }

    getCapsule() {
        let currentH = this.isDucking ? this.r * 0.5 : this.r;
        let cx = this.x + this.r / 2;
        let cy1 = this.y + currentH * 0.25;
        let cy2 = this.y + currentH * 0.75;
        let radius = currentH * 0.35;
        return { x1: cx, y1: cy1, x2: cx, y2: cy2, r: radius };
    }

    drawCapsuleDebug() {
        let cap = this.getCapsule();
        push();
        stroke(255, 0, 0, 180);
        strokeWeight(2);
        noFill();
        line(cap.x1 - cap.r, cap.y1, cap.x2 - cap.r, cap.y2);
        line(cap.x1 + cap.r, cap.y1, cap.x2 + cap.r, cap.y2);
        ellipse(cap.x1, cap.y1, cap.r * 2);
        ellipse(cap.x2, cap.y2, cap.r * 2);
        pop();
    }

    hits(obs) {
        let cap = this.getCapsule();
        let rx = obs.x, ry = obs.y, rw = obs.w, rh = obs.h;
        let testX = constrain(cap.x1, rx, rx + rw);
        let testY = constrain((cap.y1 + cap.y2) / 2, ry, ry + rh);
        let d = dist(cap.x1, (cap.y1 + cap.y2) / 2, testX, testY);
        return d < cap.r + Math.max(rw, rh) / 2 && collideRectRect(this.x, this.y, this.r, this.isDucking ? this.r * 0.5 : this.r, rx, ry, rw, rh);
    }
}

class Cactus {
    constructor() {
        this.w = 26;
        this.h = random([36, 48]);
        this.x = width;
        this.y = height - 20 - this.h;
    }

    update(spd) {
        this.x -= spd;
    }

    show() {
        push();
        textAlign(CENTER, BOTTOM);
        textSize(40);
        text('🌵', this.x + this.w / 2, this.y + this.h + 2);
        pop();
    }

    offscreen() {
        return this.x < -this.w - 10;
    }
}

class Bird {
    constructor() {
        this.w = 32;
        this.h = 24;
        this.x = width;
        this.y = height - 20 - random([50, 85]);
    }

    update(spd) {
        this.x -= (spd + 1);
    }

    show() {
        push();
        textAlign(CENTER, CENTER);
        textSize(36);
        text('🦅', this.x + this.w / 2, this.y + this.h / 2);
        pop();
    }

    offscreen() {
        return this.x < -this.w - 10;
    }
}

class Coin {
    constructor(spd) {
        this.x = width + 10;
        this.y = random([height - 65, height - 95, height - 125]);
        this.r = 13;
    }
    update(spd) { this.x -= spd; }
    show() {
        push();
        stroke('#b77900'); strokeWeight(2);
        fill('#ffd60a'); ellipse(this.x, this.y, this.r * 2);
        noStroke(); fill('#fff3a3'); ellipse(this.x - 3, this.y - 3, 7, 7);
        fill('#9c6500'); textAlign(CENTER, CENTER); textSize(13); text('$', this.x, this.y + 1);
        pop();
    }
    collectedBy(player) {
        return collideRectRect(player.x, player.y, player.r, player.isDucking ? player.r * 0.5 : player.r,
            this.x - this.r, this.y - this.r, this.r * 2, this.r * 2);
    }
    offscreen() { return this.x < -30; }
}

class ShieldPowerup {
    constructor(spd) {
        this.x = width + 10;
        this.y = random([height - 70, height - 105]);
        this.r = 15;
    }
    update(spd) { this.x -= spd; }
    show() {
        push();
        stroke('#0077b6'); strokeWeight(2);
        fill('#90e0ef'); ellipse(this.x, this.y, this.r * 2);
        noStroke(); textAlign(CENTER, CENTER); textSize(20); text('🛡️', this.x, this.y);
        pop();
    }
    collectedBy(player) {
        return collideRectRect(player.x, player.y, player.r, player.isDucking ? player.r * 0.5 : player.r,
            this.x - this.r, this.y - this.r, this.r * 2, this.r * 2);
    }
    offscreen() { return this.x < -35; }
}

function collideRectRect(x1, y1, w1, h1, x2, y2, w2, h2) {
    return x1 + w1 >= x2 && x1 <= x2 + w2 && y1 + h1 >= y2 && y1 <= y2 + h2;
}
</script>

</body>
</html>
